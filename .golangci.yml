version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - misspell
  settings:
    gocritic:
      disabled-checks:
        - commentFormatting
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

run:
  timeout: 3m
